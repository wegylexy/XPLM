[package]
name = "flybywireless-xplm-sys"
version = "0.1.3"
description = "Raw bindgen FFI bindings over the X-Plane plugin SDK"
edition.workspace = true
authors.workspace = true
readme = "README.md"
license.workspace = true
repository.workspace = true
links = "XPLM"
build = "build.rs"
# Explicit include, not .gitignore-derived: vendor/xplm-sdk is deliberately
# gitignored (see .gitignore) but must still ship inside the published
# tarball so `cargo publish`'s verify build (and any downstream consumer's
# build) has the SDK without a separate download step.
include = [
    "src/**",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "vendor/xplm-sdk/CHeaders/**",
    "vendor/xplm-sdk/Libraries/**",
    "vendor/xplm-sdk/license.txt",
]

[dependencies]

[build-dependencies]
bindgen = "0.69"
cc = "1"

[features]
# Feature flags mirror the XPLM<version> macros defined in the vendored
# CHeaders. They are cumulative in the SDK sense: the SDK does not imply
# lower versions when a higher one is defined, so each feature here
# depends on the one below it to pass every required -D flag together.
XPLM200 = []
XPLM210 = ["XPLM200"]
XPLM300 = ["XPLM210"]
XPLM301 = ["XPLM300"]
XPLM302 = ["XPLM301"]
XPLM303 = ["XPLM302"]
XPLM400 = ["XPLM303"]
XPLM410 = ["XPLM400"]
XPLM420 = ["XPLM410"]

# Opt-in: exposes symbols gated behind `#if defined(XPLM_DEPRECATED)` in the
# headers (old texture/font enum members, mostly). Off by default, matching
# the header's own "don't use these" guidance — the safe wrappers in `xplm`
# mark anything gated behind this `#[deprecated]` rather than hiding it
# outright, so turning this on gets you a compiler warning per use, not a
# silent trap.
deprecated = []

# Opt-in: bindgens and links XPWidgets_64 (Widgets/XPWidgets.h et al.) — a
# second native library alongside XPLM_64. Off by default so a plugin that
# never touches the widgets UI toolkit doesn't link a DLL it never calls
# into.
widgets = []

default = ["XPLM420"]
