[package]
name = "xplm"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
xplm-sys = { path = "../xplm-sys", default-features = false }
xplm-macros = { path = "../xplm-macros" }

[dev-dependencies]
trybuild = "1"

[features]
XPLM200 = ["xplm-sys/XPLM200"]
XPLM210 = ["XPLM200", "xplm-sys/XPLM210"]
XPLM300 = ["XPLM210", "xplm-sys/XPLM300"]
XPLM301 = ["XPLM300", "xplm-sys/XPLM301"]
XPLM302 = ["XPLM301", "xplm-sys/XPLM302"]
XPLM303 = ["XPLM302", "xplm-sys/XPLM303"]
XPLM400 = ["XPLM303", "xplm-sys/XPLM400"]
XPLM410 = ["XPLM400", "xplm-sys/XPLM410"]
XPLM420 = ["XPLM410", "xplm-sys/XPLM420"]

# See xplm-sys/Cargo.toml: opt-in, off by default, and anything gated behind
# it in this crate is marked #[deprecated] rather than hidden outright.
deprecated = ["xplm-sys/deprecated"]

# See xplm-sys/Cargo.toml: opt-in, off by default so a plugin that never
# touches the widgets UI toolkit doesn't link XPWidgets_64.
widgets = ["xplm-sys/widgets"]

default = ["XPLM420"]
